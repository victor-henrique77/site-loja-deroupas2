<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vitrine de moda moderna com busca, filtros, favoritos, carrinho e checkout simulado."
    />
    <title>Climax Fashion — Moda & Estilo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css">
    
  </head>
  <body>
    <header>
      <div class="container topbar">
        <div class="logo">CLIMAX<span>FASHION</span></div>
        <label class="search" aria-label="Buscar produtos"
          ><input
            id="search"
            type="search"
            placeholder="Buscar por produto, categoria..."
            autocomplete="off"
          /><span class="search-icon">⌕</span></label
        >
        <div class="actions">
          <button class="icon-btn" id="favBtn" title="Favoritos">♡</button
          ><button class="icon-btn" id="cartBtn" title="Carrinho">
            🛍<span class="badge" id="cartBadge">0</span>
          </button>
        </div>
      </div>
      <nav><div class="container nav-inner" id="nav"></div></nav>
    </header>

    <main class="container">
      <section class="hero">
        <div>
          <div class="eyebrow">Nova coleção · 2026</div>
          <h1>Estilo que combina com você.</h1>
          <p>
            Peças selecionadas para um guarda-roupa contemporâneo, versátil e
            atemporal.
          </p>
        </div>
      </section>
      <div class="layout">
        <aside class="sidebar">
          <h3>Categorias</h3>
          <div class="filter-list" id="filters"></div>
          <div class="promo">
            <strong>Oferta da semana</strong
            ><small
              >Use o estilo a seu favor. Frete grátis em pedidos acima de R$
              299.</small
            >
          </div>
        </aside>
        <section>
          <div class="catalog-head">
            <span class="count" id="count"></span
            ><select class="sort" id="sort">
              <option value="default">Mais relevantes</option>
              <option value="low">Menor preço</option>
              <option value="high">Maior preço</option>
            </select>
          </div>
          <div class="grid" id="grid"></div>
        </section>
      </div>
    </main>

    <div class="overlay" id="modalOverlay">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-grid">
          <div class="modal-img"><img id="modalImg" alt="" /></div>
          <div class="modal-info">
            <button class="close" id="modalClose">×</button>
            <div class="category" id="modalCat"></div>
            <h2 id="modalTitle"></h2>
            <p id="modalDesc"></p>
            <div class="modal-price" id="modalPrice"></div>
            <div class="modal-actions">
              <button class="primary" id="modalAdd">
                Adicionar ao carrinho</button
              ><button class="secondary" id="modalFav">♡ Favoritar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <aside class="drawer" id="drawer">
      <div class="drawer-head">
        <h2>Seu carrinho</h2>
        <button class="close" id="drawerClose">×</button>
      </div>
      <div class="cart-list" id="cartList"></div>
      <div class="drawer-foot">
        <div class="total">
          <span>Total</span><span id="total">R$ 0,00</span>
        </div>
        <button class="checkout" id="checkout" disabled>
          Finalizar Pedido
        </button>
      </div>
    </aside>
    <div class="toast" id="toast"></div>
    <script src="script/script.js"></script>
  </body>
</html>
